name: CI

# Every branch except main and every pull request: checks, then Android and iOS builds
# to prove both native projects still compile. Releases are built by android.yml / ios.yml.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, tests, formatting
        run: npm run check

      - name: Build web app
        run: npm run build

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    env:
      VITE_STORE: play
      VITE_RC_ANDROID_KEY: ${{ vars.RC_ANDROID_KEY }}
      VITE_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1e1e1e' --iconBackgroundColorDark '#1e1e1e' --splashBackgroundColor '#eaeaea' --splashBackgroundColorDark '#eaeaea'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SubShelf-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    env:
      VITE_STORE: appstore
      VITE_RC_IOS_KEY: ${{ vars.RC_IOS_KEY }}
      VITE_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Generate app icons
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#1e1e1e' --iconBackgroundColorDark '#1e1e1e' --splashBackgroundColor '#eaeaea' --splashBackgroundColorDark '#eaeaea'

      - name: Build for simulator (no signing)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
