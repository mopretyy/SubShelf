name: iOS release (TestFlight)

# Manual: Actions → "iOS release (TestFlight)" → Run workflow.
# Builds on a GitHub Mac, signs automatically with an App Store Connect API key
# and uploads the build to TestFlight. No Mac needed on your side.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
      VITE_STORE: appstore
      VITE_RC_IOS_KEY: ${{ vars.RC_IOS_KEY }}
      VITE_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
    steps:
      - name: Check secrets and variables
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing secret:APPSTORE_API_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing secret:APPSTORE_API_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing secret:APPSTORE_API_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing variable:APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing. See docs/PUBLISHING.md, section App Store."
            exit 1
          fi
          [ -n "$VITE_RC_IOS_KEY" ] || echo "::warning::Variable RC_IOS_KEY is not set: this build cannot sell Pro"

      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, tests, formatting
        run: npm run check

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Generate app icons
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#1e1e1e' --iconBackgroundColorDark '#1e1e1e' --splashBackgroundColor '#eaeaea' --splashBackgroundColorDark '#eaeaea'

      - name: Write App Store Connect API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # The secret may hold the .p8 file as is or base64-encoded.
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH"
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SubShelf.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SubShelf.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded SubShelf $VERSION_NAME ($BUILD_NUMBER). It appears in TestFlight after Apple finishes processing (10–30 min)."

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
